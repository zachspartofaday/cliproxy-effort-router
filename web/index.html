<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effort routing</title>
<style>
  :root { color-scheme: light dark; --muted: #888; --line: rgba(128,128,128,.3); --low: #4c9be8; --medium: #43b581; --high: #e8a33c; --xhigh: #d9534f; }
  body { font: 14px/1.45 system-ui, sans-serif; margin: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 20px 0 8px; }
  .muted { color: var(--muted); } .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .badge { padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { display: flex; height: 14px; min-width: 2px; border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; }
  .low { background: var(--low); } .medium { background: var(--medium); } .high { background: var(--high); } .xhigh { background: var(--xhigh); } .none { background: var(--muted); }
  input, select, button { font: inherit; } #error { color: #d9534f; }
  td:last-child .bar { min-width: 180px; }
  td.low, td.medium, td.high, td.xhigh, td.none { background: none; border-left: 6px solid; }
  td.low { border-left-color: var(--low); } td.medium { border-left-color: var(--medium); } td.high { border-left-color: var(--high); } td.xhigh { border-left-color: var(--xhigh); } td.none { border-left-color: var(--muted); }
</style>
</head>
<body>
<h1>Effort routing</h1>
<p class="muted">Decisions the effort router made, read from its state file. They show what the router chose; for Codex the forwarded effort also appears in CPA's usage log.</p>
<form id="auth" class="row">
  <label>Management key <input id="key" type="password" autocomplete="off" size="28"></label>
  <label>Window <select id="hours"><option value="6">6 h</option><option value="24" selected>24 h</option><option value="72">72 h</option><option value="168">7 days</option></select></label>
  <button type="submit">Load</button>
  <span class="muted">The key stays in this tab only.</span>
</form>
<p id="error"></p>
<div id="out" hidden>
  <div class="row" id="status"></div>
  <h2>Live decisions by model</h2><table id="models"></table>
  <h2>By hour</h2><table id="hourly"></table>
  <h2>Classifier</h2><div class="row" id="classifier"></div>
  <h2>Recent turns</h2><table id="recent"></table>
</div>
<script src="app.js"></script>
</body>
</html>
