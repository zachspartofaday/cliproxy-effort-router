# Optional /etc/systemd/system/jev-ocg-adapter.service.d/compare.conf
# Requires plugin shadow:true. Remove before active routing qualification.
[Service]
LoadCredential=cpa-key:/etc/jev-ocg-adapter/cpa-key
ExecStart=
ExecStart=/usr/local/libexec/jev-ocg-adapter -listen 127.0.0.1:8765 -backend jev -jev-model jev-1.13-free -compare-ocg -cpa-url http://127.0.0.1:8317 -model ocg/deepseek-v4.1-flash -timeout 1200ms
